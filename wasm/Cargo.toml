[package]
name = "eliah-wasm"
version = "0.3.0"
edition = "2021"
publish = false
description = "ELIAH compiled for the browser (wasm32-unknown-unknown): plain number exports, no JavaScript glue"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
eliah = { path = ".." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
